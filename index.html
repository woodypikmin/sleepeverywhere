<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pikmin 盆栽收成記錄器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f1f5f9; }
        input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        const { useState, useEffect } = React;
        const ADMIN_PASSWORD = "admin";

        const PIKMIN_CATEGORIES = {
            "餐廳": ["廚師帽子"], "咖啡廳": ["咖啡杯"], "甜點店": ["馬卡龍", "甜甜圈"], "電影院": ["爆米花"],
            "藥局": ["牙刷"], "動物園": ["蒲公英"], "森林": ["橡栗"], "水邊": ["擬餌"],
            "郵局": ["郵票"], "美術館": ["畫框"], "機場": ["飛機玩具"], "車站": ["電車紙模型", "票券"],
            "海灘": ["貝殼"], "漢堡店": ["漢堡"], "便利商店": ["瓶蓋", "零食"], "超市": ["蘑菇", "香蕉"],
            "麵包店": ["法國麵包"], "美容院": ["剪刀"], "服飾店": ["髮圈"], "公園": ["幸運草", "四葉幸運草"],
            "圖書館": ["迷你書"], "路邊": ["路邊"], "壽司餐廳": ["壽司"],
            "山丘": ["山丘別針徽章"], "體育館": ["體育館鑰匙圈"], "五金行": ["工具"], "公車站": ["公車紙模型"],
            "化妝品商店": ["化妝品"], "義式餐廳": ["披薩", "義大利麵"], "咖哩餐廳": ["一碗咖哩"],
            "飯店": ["飯店備品"], "主題樂園": ["主題樂園門票"], "墨西哥餐廳": ["塔可餅"], "橋樑": ["橋樑別針"],
            "神社和寺廟": ["大吉", "吉", "末吉"], "洗衣店": ["洗衣用品"], "拉麵店": ["拉麵鑰匙圈"],
            "學校": ["校徽胸針"], "電器行": ["電池", "仙女燈"], "韓國餐廳": ["韓國泡菜"], "起司店": ["起司"],
            "其他": ["其他"]
        };

        const COLORS = [
            { id: 'red', label: '紅', bg: 'bg-red-500', text: 'text-white' },
            { id: 'yellow', label: '黃', bg: 'bg-yellow-400', text: 'text-yellow-900' },
            { id: 'blue', label: '藍', bg: 'bg-blue-500', text: 'text-white' },
            { id: 'purple', label: '紫', bg: 'bg-purple-600', text: 'text-white' },
            { id: 'white', label: '白', bg: 'bg-white', text: 'text-gray-800', border: 'border border-gray-300' },
            { id: 'pink', label: '粉', bg: 'bg-pink-400', text: 'text-white' },
            { id: 'rock', label: '岩', bg: 'bg-gray-600', text: 'text-white' },
            { id: 'ice', label: '冰', bg: 'bg-cyan-300', text: 'text-cyan-900' }
        ];

        const getEmptyColors = () => ({ red: 0, yellow: 0, blue: 0, purple: 0, white: 0, pink: 0, rock: 0, ice: 0 });

        const ColorCounter = ({ color, count, onChange, disabled }) => (
            <div className={`flex flex-col items-center justify-between p-1.5 rounded-lg ${color.bg} ${color.text} ${color.border || 'border border-transparent'} shadow-sm min-w-[3.5rem]`}>
                <span className="text-[11px] font-black mb-1">{color.label}</span>
                <div className="flex items-center gap-1 bg-black/10 rounded px-1 py-0.5 w-full justify-between">
                    <button type="button" disabled={disabled} onClick={() => onChange(Math.max(0, count - 1))} className="w-4 h-4 flex items-center justify-center rounded hover:bg-black/20 font-mono text-xs disabled:opacity-30">-</button>
                    <span className="text-xs font-black text-center">{count}</span>
                    <button type="button" disabled={disabled} onClick={() => onChange(count + 1)} className="w-4 h-4 flex items-center justify-center rounded hover:bg-black/20 font-mono text-xs disabled:opacity-30">+</button>
                </div>
            </div>
        );

        const TargetLocalClock = ({ lat, lng }) => {
            const [timeStr, setTimeStr] = useState("");
            useEffect(() => {
                let isMounted = true;
                const fetchTime = async () => {
                    try {
                        const res = await fetch(`https://timeapi.io/api/TimeZone/coordinate?latitude=${lat}&longitude=${lng}`);
                        if (res.ok) {
                            const data = await res.json();
                            if (isMounted && data.currentLocalTime) setTimeStr(data.currentLocalTime.split('T')[1].slice(0, 5));
                        }
                    } catch (e) {}
                };
                fetchTime();
                const id = setInterval(fetchTime, 30000);
                return () => { isMounted = false; clearInterval(id); };
            }, [lat, lng]);
            return timeStr ? <span className="text-xs bg-slate-700 text-emerald-300 px-2 py-0.5 rounded font-mono ml-2">當地: {timeStr}</span> : null;
        };

        const App = () => {
            const [locations, setLocations] = useState([]);
            const [isAdmin, setIsAdmin] = useState(false);
            const [lat, setLat] = useState("");
            const [lng, setLng] = useState("");
            const [region, setRegion] = useState("");
            const [customName, setCustomName] = useState("");
            const [visitDate, setVisitDate] = useState(new Date().toISOString().slice(0, 10));
            const [records, setRecords] = useState([{ id: Date.now(), category: "餐廳", subCategory: "廚師帽子", colors: getEmptyColors() }]);
            const [editingVisitId, setEditingVisitId] = useState(null);
            const [expandedLocs, setExpandedLocs] = useState(new Set());

            useEffect(() => {
                localforage.config({ name: 'PikminHarvestTracker' });
                localforage.getItem('pikmin-seedlings').then(saved => saved && setLocations(saved));
                if (sessionStorage.getItem('pikmin-admin-auth') === 'true') setIsAdmin(true);
            }, []);

            const handleSave = async () => {
                if (!isAdmin) return;
                if (!lat || !lng || !visitDate) return alert("座標與日期必填");
                const locKey = `${parseFloat(lat).toFixed(5)},${parseFloat(lng).toFixed(5)}`;
                let existingLocs = [...locations];
                let locIndex = existingLocs.findIndex(l => l.key === locKey);
                const newVisit = { id: editingVisitId || Date.now().toString(), date: visitDate, records };
                if (locIndex >= 0) {
                    if (editingVisitId) existingLocs[locIndex].visits = existingLocs[locIndex].visits.map(v => v.id === editingVisitId ? newVisit : v);
                    else existingLocs[locIndex].visits.push(newVisit);
                    existingLocs[locIndex].visits.sort((a,b) => b.date.localeCompare(a.date));
                    existingLocs[locIndex].region = region;
                    existingLocs[locIndex].customName = customName;
                } else {
                    existingLocs.push({ key: locKey, lat, lng, region, customName, targetCategory: "餐廳", visits: [newVisit] });
                }
                await localforage.setItem('pikmin-seedlings', existingLocs);
                setLocations(existingLocs);
                setRecords([{ id: Date.now(), category: "餐廳", subCategory: "廚師帽子", colors: getEmptyColors() }]);
                setEditingVisitId(null); setLat(""); setLng(""); setRegion(""); setCustomName("");
                alert("💾 儲存成功！");
            };

            return (
                <div className="min-h-screen bg-slate-50">
                    <header className="bg-emerald-600 text-white shadow-lg sticky top-0 z-30">
                        <div className="max-w-5xl mx-auto px-4 py-4 flex items-center justify-between">
                            <h1 className="text-xl font-bold">Pikmin 盆栽收成記錄器</h1>
                            <button onClick={() => { if(isAdmin){ setIsAdmin(false); sessionStorage.removeItem('pikmin-admin-auth'); } else { const p = prompt("密碼:"); if(p==ADMIN_PASSWORD){ setIsAdmin(true); sessionStorage.setItem('pikmin-admin-auth', 'true'); } }}} className="bg-emerald-800 px-3 py-1 rounded text-xs font-bold">
                                {isAdmin ? "🔓 管理模式" : "🔒 訪客模式"}
                            </button>
                        </div>
                    </header>

                    <main className="max-w-5xl mx-auto px-4 py-6 grid grid-cols-1 lg:grid-cols-12 gap-8">
                        {isAdmin && (
                            <div className="lg:col-span-5 bg-white p-6 rounded-2xl border shadow-sm">
                                <h2 className="font-black mb-4">{editingVisitId ? "修改" : "新增"}</h2>
                                <div className="grid grid-cols-2 gap-2 mb-2">
                                    <input placeholder="緯度" className="p-2 border rounded text-sm" value={lat} onChange={e=>setLat(e.target.value)}/>
                                    <input placeholder="經度" className="p-2 border rounded text-sm" value={lng} onChange={e=>setLng(e.target.value)}/>
                                </div>
                                <button onClick={async()=>{try{const r=await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lng}`); const d=await r.json(); setRegion([d.principalSubdivision, d.locality].filter(Boolean).join(" "));}catch(e){}}} className="w-full bg-slate-200 py-1 mb-2 text-xs rounded">解析地區</button>
                                <input placeholder="自訂地點名稱" className="w-full p-2 border rounded mb-2 text-sm" value={customName} onChange={e=>setCustomName(e.target.value)}/>
                                <input type="date" className="w-full p-2 border rounded mb-4" value={visitDate} onChange={e=>setVisitDate(e.target.value)}/>
                                {records.map((r, i) => (
                                    <div key={r.id} className="bg-slate-50 p-3 rounded-lg mb-2">
                                        <select className="w-full mb-2 p-1 border rounded text-sm" value={r.cat} onChange={e => { let n=[...records]; n[i]={...n[i], cat:e.target.value, sub:CATEGORIES[e.target.value][0]}; setRecords(n); }}>
                                            {Object.keys(CATEGORIES).map(c => <option key={c} value={c}>{c}</option>)}
                                        </select>
                                        <div className="grid grid-cols-4 gap-1">
                                            {COLORS.map(c => <div key={c.id}><div className="text-[10px] text-center">{c.label}</div><input type="number" className="w-full border rounded text-center text-sm" value={r.counts[c.label]||0} onChange={e=>{let n=[...records]; n[i].counts[c.label]=parseInt(e.target.value)||0; setRecords(n);}}/></div>)}
                                        </div>
                                    </div>
                                ))}
                                <button onClick={handleSave} className="w-full py-3 bg-emerald-600 text-white font-black rounded-xl mt-4">儲存紀錄</button>
                            </div>
                        )}

                        <div className={`${isAdmin ? 'lg:col-span-7' : 'lg:col-span-12'} space-y-4`}>
                            {locations.sort((a,b) => b.visits[0].date.localeCompare(a.visits[0].date)).map(loc => (
                                <div key={loc.key} className="bg-white p-4 rounded-xl border shadow-sm">
                                    <div className="flex justify-between items-center cursor-pointer" onClick={() => {const n=new Set(expandedLocs); if(n.has(loc.key)) n.delete(loc.key); else n.add(loc.key); setExpandedLocs(n);}}>
                                        <div>
                                            <h2 className="font-black text-lg">{loc.customName || loc.region || "未知地點"} <TargetLocalClock lat={loc.lat} lng={loc.lng} /></h2>
                                            <p className="text-[10px] text-slate-400 font-mono">{loc.lat}, {loc.lng}</p>
                                        </div>
                                        <div className="text-right">
                                            <div className="text-xs font-bold text-emerald-600">🎯 {loc.targetCategory||"餐廳"}</div>
                                            <div className="text-sm font-black">{loc.visits.reduce((acc, v)=>acc+v.records.reduce((a,r)=>a+Object.values(r.counts).reduce((x,y)=>x+y,0),0),0)} 盆</div>
                                        </div>
                                    </div>
                                    {expandedLocs.has(loc.key) && loc.visits.map(v => (
                                        <div key={v.id} className="mt-4 pt-4 border-t border-slate-100">
                                            <div className="flex justify-between text-xs font-bold text-slate-500 mb-2">
                                                <span>{v.date}</span>
                                                {/* 計算該日期下，目標種類的總盆數 */}
                                                <span>目標數: {v.records.filter(r=>r.cat===(loc.targetCategory||"餐廳")).reduce((a,r)=>a+Object.values(r.counts).reduce((x,y)=>x+y,0), 0)}</span>
                                            </div>
                                            {v.records.map((r, i) => <div key={i} className="text-sm font-bold text-slate-700">{r.cat}: {Object.entries(r.counts).filter(([_,v])=>v>0).map(([k,v]) => `${k}${v}`).join(' ')}</div>)}
                                            {isAdmin && <button onClick={() => { setLat(loc.lat); setLng(loc.lng); setRegion(loc.region); setVisitDate(v.date); setEditingVisitId(v.id); setRecords(v.records); }} className="text-emerald-600 text-xs font-bold mt-2 hover:underline">編輯</button>}
                                        </div>
                                    ))}
                                </div>
                            ))}
                        </div>
                    </main>
                </div>
            );
        };
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
