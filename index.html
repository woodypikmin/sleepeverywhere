<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pikmin Bloom 盆栽收成記錄器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script>
        Babel.registerPreset('react-classic', {
            presets: [
                [Babel.availablePresets.react, { "runtime": "classic" }]
            ]
        });
    </script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: 'Nunito', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f1f5f9; }
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .glass-panel { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="bg-gradient-to-br from-green-50 via-emerald-50 to-teal-100 min-h-screen text-slate-800">
    <div id="root"></div>

    <script type="text/babel" data-type="module" data-presets="react-classic">
        const { useState, useEffect, useMemo, useCallback, Fragment } = React;

        const ADMIN_PASSWORD = "admin";
        const GOOGLE_SHEETS_API_URL = "https://script.google.com/macros/s/AKfycbwgDoLcjCPHOA3hxj2CEZdXYO2K3lWSZASHg7Z0Yy5N83_82HoNf8MPp9kA6wtiBkwq/exec";

        const PIKMIN_CATEGORIES = {
            "餐廳": ["廚師帽子"], "咖啡廳": ["咖啡杯"], "甜點店": ["馬卡龍", "甜甜圈"], "電影院": ["爆米花"],
            "藥局": ["牙刷"], "動物園": ["蒲公英"], "森林": ["鍬形蟲", "橡栗"], "水邊": ["擬餌"],
            "郵局": ["郵票"], "美術館": ["畫框"], "機場": ["飛機玩具"], "車站": ["電車紙模型", "票券"],
            "海灘": ["貝殼"], "漢堡店": ["漢堡"], "便利商店": ["瓶蓋", "零食"], "超市": ["蘑菇", "香蕉"],
            "麵包店": ["法國麵包"], "美容院": ["剪刀"], "服飾店": ["髮圈"], "公園": ["幸運草", "四葉幸運草"],
            "圖書館": ["迷你書"], "路邊": ["路邊"], "壽司餐廳": ["壽司"],
            "山丘": ["山丘別針徽章"], "體育館": ["體育館鑰匙圈"], "五金行": ["工具"], "公車站": ["公車紙模型"],
            "化妝品商店": ["化妝品"], "義式餐廳": ["披薩", "義大利麵"], "咖哩餐廳": ["一碗咖哩"],
            "飯店": ["飯店備品"], "主題樂園": ["主題樂園門票"], "墨西哥餐廳": ["塔可餅"], "橋樑": ["橋樑別針"],
            "神社和寺廟": ["大吉", "吉", "末吉"], "洗衣店": ["洗衣用品"], "拉麵店": ["拉麵鑰匙圈"],
            "學校": ["校徽胸針"], "電器行": ["電池", "仙女燈"], "韓國餐廳": ["韓國泡菜"], "文具店": ["文具"],
            "其他": ["其他"]
        };

        const COLORS = [
            { id: '紅', bg: 'bg-red-500', text: 'text-white', shadow: 'shadow-red-200' }, 
            { id: '黃', bg: 'bg-yellow-400', text: 'text-yellow-900', shadow: 'shadow-yellow-200' },
            { id: '藍', bg: 'bg-blue-500', text: 'text-white', shadow: 'shadow-blue-200' }, 
            { id: '紫', bg: 'bg-purple-600', text: 'text-white', shadow: 'shadow-purple-200' },
            { id: '白', bg: 'bg-slate-100', text: 'text-slate-700', border: 'border border-slate-300', shadow: 'shadow-slate-200' }, 
            { id: '粉', bg: 'bg-pink-400', text: 'text-white', shadow: 'shadow-pink-200' },
            { id: '岩', bg: 'bg-gray-600', text: 'text-white', shadow: 'shadow-gray-300' }, 
            { id: '冰', bg: 'bg-cyan-300', text: 'text-cyan-900', shadow: 'shadow-cyan-200' }
        ];

        const getEmptyColors = () => ({ '紅': 0, '黃': 0, '藍': 0, '紫': 0, '白': 0, '粉': 0, '岩': 0, '冰': 0 });

        const formatDateOnly = (dateString) => {
            if (!dateString) return "無紀錄";
            try {
                const d = new Date(dateString);
                if (isNaN(d.getTime())) return dateString; 
                const year = d.getFullYear();
                const month = String(d.getMonth() + 1).padStart(2, '0');
                const day = String(d.getDate()).padStart(2, '0');
                return `${year}-${month}-${day}`;
            } catch (e) {
                return dateString;
            }
        };

        const ColorCounter = ({ color, count, onChange, disabled }) => (
            <div className={`flex flex-col items-center justify-between p-2 rounded-xl transition-transform hover:scale-105 ${color.bg} ${color.text} ${color.border || ''} shadow-md ${color.shadow} min-w-[3.5rem]`}>
                <span className="text-xs font-bold mb-1.5 drop-shadow-sm">{color.id}</span>
                <div className="flex items-center gap-1 bg-black/15 rounded-lg px-1.5 py-1 w-full justify-between backdrop-blur-sm">
                    <button type="button" disabled={disabled} onClick={() => onChange(Math.max(0, count - 1))} className="w-5 h-5 flex items-center justify-center rounded-md hover:bg-black/20 font-bold text-sm disabled:opacity-30 transition-colors">-</button>
                    <span className="text-sm font-bold text-center">{count}</span>
                    <button type="button" disabled={disabled} onClick={() => onChange(count + 1)} className="w-5 h-5 flex items-center justify-center rounded-md hover:bg-black/20 font-bold text-sm disabled:opacity-30 transition-colors">+</button>
                </div>
            </div>
        );

        const TargetLocalClock = ({ lat, lng, isExpanded }) => {
            const [timeStr, setTimeStr] = useState("");
            useEffect(() => {
                let isMounted = true;
                const fetchTime = async () => {
                    try {
                        const res = await fetch(`https://timeapi.io/api/TimeZone/coordinate?latitude=${lat}&longitude=${lng}`);
                        if (res.ok) {
                            const data = await res.json();
                            if (isMounted && data.currentLocalTime) setTimeStr(data.currentLocalTime.split('T')[1].slice(0, 5));
                        }
                    } catch (e) {}
                };
                fetchTime();
                const id = setInterval(fetchTime, 30000);
                return () => { isMounted = false; clearInterval(id); };
            }, [lat, lng]);
            return timeStr ? (
                <span className={`text-[10px] font-medium tracking-wide px-2 py-0.5 rounded shadow-sm ${isExpanded ? 'bg-slate-700/80 text-emerald-300' : 'bg-slate-100 text-emerald-600 border border-emerald-100'}`}>
                    當地時間 {timeStr}
                </span>
            ) : null;
        };

        const cleanCountryName = (rawCountry) => {
            if (!rawCountry) return "";
            const parts = String(rawCountry).split(';');
            let zh = [...parts].reverse().find(p => /[\u4e00-\u9fa5]/.test(p));
            let result = (zh || parts[parts.length - 1]).trim();
            const dict = { "臺灣": "台灣", "中華民國": "台灣", "Taiwan": "台灣", "肯尼亚": "肯亞", "意大利": "義大利", "新西兰": "紐西蘭", "澳大利亚": "澳洲", "印度尼西亚": "印尼", "沙特阿拉伯": "沙烏地阿拉伯", "阿联酋": "阿拉伯聯合大公國" };
            return dict[result] || result;
        };

        const getTaiwaneseCountryName = (countryCode, fallbackName) => {
            if (!countryCode) return cleanCountryName(fallbackName);
            try {
                const regionNames = new Intl.DisplayNames(['zh-TW'], { type: 'region' });
                let name = regionNames.of(countryCode.toUpperCase());
                if (name === "臺灣" || name === "中華民國") return "台灣";
                return name;
            } catch (e) {
                return cleanCountryName(fallbackName);
            }
        };

        const parseOsmAddress = (addr) => {
            if (!addr) return "未知地點";
            const cCode = addr.country_code;
            const cName = getTaiwaneseCountryName(cCode, addr.country);
            
            const clean = (str) => {
                if (!str) return "";
                const parts = String(str).split(';');
                const zh = [...parts].reverse().find(p => /[\u4e00-\u9fa5]/.test(p));
                return (zh || parts[parts.length - 1]).trim();
            };

            let level1 = clean(addr.state || addr.province || addr.city || addr.county);
            let level2 = clean(addr.city_district || addr.district || addr.suburb || addr.town || addr.village || addr.borough);

            if (!level2 && addr.city && clean(addr.city) !== level1) level2 = clean(addr.city);
            if (!level2 && addr.county && clean(addr.county) !== level1) level2 = clean(addr.county);

            if (level1 === cName) level1 = "";
            if (level2 === level1 || level2 === cName) level2 = "";

            let result = [];
            if (cName === "台灣") {
                if (level1) result.push(level1);
                if (level2) result.push(level2);
            } else {
                if (cName) result.push(cName);
                if (level1) result.push(level1);
                if (level2) result.push(level2);
            }

            return result.join(" ").trim() || (cName ? cName : "特殊座標(需手動)");
        };

        const parseLocationData = (dataArray) => {
            return dataArray.map(loc => {
                let cat = loc.targetCategory || "餐廳";
                let sub = loc.targetSubCategory || "全部";
                
                if (cat.includes(" (") && cat.endsWith(")")) {
                    sub = cat.substring(cat.indexOf(" (") + 2, cat.length - 1);
                    cat = cat.substring(0, cat.indexOf(" ("));
                }

                if (cat === "起司店") cat = "文具店";
                if (sub === "起司") sub = "文具";

                if (loc.visits) {
                    loc.visits.forEach(v => {
                        if (v.records) {
                            v.records.forEach(r => {
                                if (r.category === "起司店") r.category = "文具店";
                                if (r.subCategory === "起司") r.subCategory = "文具";
                            });
                        }
                    });
                }

                return { ...loc, targetCategory: cat, targetSubCategory: sub };
            });
        };

        const App = () => {
            const [locations, setLocations] = useState([]);
            const [isInitialLoading, setIsInitialLoading] = useState(true);
            const [isAdmin, setIsAdmin] = useState(false);
            
            const [lat, setLat] = useState("");
            const [lng, setLng] = useState("");
            const [region, setRegion] = useState("");
            const [customName, setCustomName] = useState("");
            const [visitDate, setVisitDate] = useState(new Date().toISOString().slice(0, 10));
            const [isDetecting, setIsDetecting] = useState(false);
            const [isSaving, setIsSaving] = useState(false);
            const [editingVisitId, setEditingVisitId] = useState(null);
            
            const [expandedLocs, setExpandedLocs] = useState(new Set());
            const [records, setRecords] = useState([
                { id: Date.now(), category: "餐廳", subCategory: "廚師帽子", colors: getEmptyColors() }
            ]);

            const [globalFilterCat, setGlobalFilterCat] = useState("全部");
            const [globalFilterSub, setGlobalFilterSub] = useState("全部");
            const [globalFilterColor, setGlobalFilterColor] = useState("全部");

            useEffect(() => {
                localforage.config({ name: 'PikminHarvestTracker' });
                if (sessionStorage.getItem('pikmin-admin-auth') === 'true') setIsAdmin(true);

                if (GOOGLE_SHEETS_API_URL.startsWith("http")) {
                    fetch(GOOGLE_SHEETS_API_URL)
                        .then(res => res.json())
                        .then(data => {
                            const parsedData = parseLocationData(data);
                            setLocations(parsedData);
                            localforage.setItem('pikmin-seedlings', parsedData);
                            setIsInitialLoading(false);
                        })
                        .catch(err => {
                            console.error("雲端讀取失敗，讀取本地備用庫");
                            localforage.getItem('pikmin-seedlings').then(saved => {
                                if (saved) setLocations(parseLocationData(saved));
                                setIsInitialLoading(false);
                            });
                        });
                } else {
                    localforage.getItem('pikmin-seedlings').then(saved => {
                        if (saved) setLocations(parseLocationData(saved));
                        setIsInitialLoading(false);
                    });
                }
            }, []);

            const syncToCloud = async (dataToSync) => {
                if (!GOOGLE_SHEETS_API_URL.startsWith("http")) return;
                try {
                    const payloadData = dataToSync.map(loc => {
                        let combined = loc.targetCategory || "餐廳";
                        if (loc.targetSubCategory && loc.targetSubCategory !== "全部") {
                            combined += ` (${loc.targetSubCategory})`;
                        }
                        return { ...loc, targetCategory: combined };
                    });

                    await fetch(GOOGLE_SHEETS_API_URL, {
                        method: "POST",
                        body: JSON.stringify({ action: "sync_all", data: payloadData })
                    });
                } catch (e) { console.error("雲端寫入失敗", e); }
            };

            const handleAdminToggle = () => {
                if (isAdmin) {
                    if (confirm("確定要登出管理員模式（鎖定網頁）嗎？")) {
                        setIsAdmin(false);
                        sessionStorage.removeItem('pikmin-admin-auth');
                        setEditingVisitId(null);
                    }
                } else {
                    const pwd = prompt("請輸入管理員密碼解鎖編輯功能：");
                    if (pwd === ADMIN_PASSWORD) {
                        setIsAdmin(true);
                        sessionStorage.setItem('pikmin-admin-auth', 'true');
                        alert("🔓 解鎖成功！管理員模式已開啟。");
                    } else if (pwd !== null) {
                        alert("❌ 密碼錯誤！無法開啟編輯功能。");
                    }
                }
            };

            const handleCoordinatePaste = (e) => {
                if (!isAdmin) return;
                const text = e.clipboardData.getData('text').trim();
                const coordsRegex = /^[\(\[]?\s*(-?\d+(\.\d+)?)\s*[,;]\s*(-?\d+(\.\d+)?)\s*[\)\]]?$/;
                const match = text.match(coordsRegex);
                if (match) {
                    e.preventDefault(); 
                    setLat(match[1]);
                    setLng(match[3]);
                }
            };

            const handleDetectLocation = async () => {
                if (!lat || !lng) return alert("請先填寫緯度與經度！");
                
                let numLat = parseFloat(lat);
                let numLng = parseFloat(lng);
                
                if (isNaN(numLat) || isNaN(numLng)) return;

                if (Math.abs(numLat) > 90 && Math.abs(numLng) <= 90) {
                    let temp = numLat;
                    numLat = numLng;
                    numLng = temp;
                    setLat(String(numLat));
                    setLng(String(numLng));
                }

                if (numLat < -90 || numLat > 90 || numLng < -180 || numLng > 180) {
                    return alert("無效的座標格式！");
                }

                setIsDetecting(true);
                try {
                    const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${numLat}&lon=${numLng}&accept-language=zh-TW`);
                    if (!res.ok) throw new Error("API Limit");
                    const data = await res.json();
                    
                    if (data && data.address) {
                        setRegion(parseOsmAddress(data.address));
                    } else {
                        setRegion("未知地點");
                    }
                } catch (error) {
                    alert("解析地點失敗，請確認網路與座標格式。");
                } finally {
                    setIsDetecting(false);
                }
            };

            const handleAddRecordBlock = () => {
                setRecords([...records, { id: Date.now(), category: "餐廳", subCategory: "廚師帽子", colors: getEmptyColors() }]);
            };

            const handleRemoveRecordBlock = (id) => {
                if (records.length === 1) return alert("至少需要保留一個類別喔！");
                setRecords(records.filter(r => r.id !== id));
            };

            const updateRecord = (id, field, value) => {
                setRecords(records.map(r => {
                    if (r.id === id) {
                        if (field === 'category') {
                            const sub = value === "路邊" ? "路邊" : PIKMIN_CATEGORIES[value][0];
                            return { ...r, category: value, subCategory: sub };
                        }
                        if (field.startsWith('color_')) {
                            const colorName = field.split('_')[1];
                            return { ...r, colors: { ...r.colors, [colorName]: value } };
                        }
                        return { ...r, [field]: value };
                    }
                    return r;
                }));
            };

            const handleSave = async () => {
                if (!isAdmin) return;
                if (!lat || !lng || !visitDate) return alert("座標與日期為必填項目！");
                const hasColors = records.some(r => Object.values(r.colors || {}).some(count => count > 0));
                if (!hasColors) return alert("請至少填寫一個盆栽的顏色數量！");

                setIsSaving(true);
                const locKey = `${parseFloat(lat).toFixed(5)},${parseFloat(lng).toFixed(5)}`;
                let existingLocs = [...locations];
                let locIndex = existingLocs.findIndex(l => l.key === locKey);
                
                const newVisit = {
                    id: editingVisitId || Date.now().toString(),
                    date: visitDate, 
                    records: records.map(r => ({ ...r }))
                };

                if (locIndex >= 0) {
                    if (editingVisitId) {
                        existingLocs[locIndex].visits = existingLocs[locIndex].visits.map(v => v.id === editingVisitId ? newVisit : v);
                    } else {
                        existingLocs[locIndex].visits.push(newVisit);
                    }
                    existingLocs[locIndex].visits.sort((a,b) => b.date.localeCompare(a.date));
                    existingLocs[locIndex].region = region || existingLocs[locIndex].region;
                    existingLocs[locIndex].customName = customName.trim() || existingLocs[locIndex].customName || "";
                } else {
                    existingLocs.push({
                        key: locKey, lat, lng, region, customName: customName.trim(), targetCategory: "餐廳", targetSubCategory: "全部", visits: [newVisit]
                    });
                }
                
                setLocations(existingLocs);
                await localforage.setItem('pikmin-seedlings', existingLocs);
                await syncToCloud(existingLocs);
                
                const nextExpanded = new Set(expandedLocs);
                nextExpanded.add(locKey);
                setExpandedLocs(nextExpanded);

                setRecords([{ id: Date.now(), category: "餐廳", subCategory: "廚師帽子", colors: getEmptyColors() }]);
                setEditingVisitId(null);
                setLat(""); setLng(""); setRegion(""); setCustomName("");
                
                setIsSaving(false);
                
                const toast = document.createElement('div');
                toast.className = "fixed bottom-5 right-5 bg-slate-800 text-white px-4 py-2 rounded-xl shadow-2xl z-50 text-sm font-bold transition-opacity duration-300";
                toast.innerText = "💾 已儲存並同步至雲端！";
                document.body.appendChild(toast);
                setTimeout(() => { toast.style.opacity = '0'; setTimeout(()=> toast.remove(), 300); }, 2000);
            };

            const handleEditVisit = (loc, visit) => {
                if (!isAdmin) return;
                setLat(loc.lat);
                setLng(loc.lng);
                setRegion(loc.region);
                setCustomName(loc.customName || "");
                setVisitDate(formatDateOnly(visit.date));
                setEditingVisitId(visit.id);
                setRecords(visit.records.map(r => ({ ...r, id: r.id || Date.now() + Math.random() })));
                window.scrollTo({ top: 0, behavior: 'smooth' }); 
            };

            const handleUpdateTargetCategory = async (key, value) => {
                if (!isAdmin) return;
                const nextLocs = locations.map(l => {
                    if (l.key === key) return { ...l, targetCategory: value, targetSubCategory: "全部" };
                    return l;
                });
                setLocations(nextLocs);
                await localforage.setItem('pikmin-seedlings', nextLocs);
                await syncToCloud(nextLocs);
            };

            const handleUpdateTargetSubCategory = async (key, value) => {
                if (!isAdmin) return;
                const nextLocs = locations.map(l => {
                    if (l.key === key) return { ...l, targetSubCategory: value };
                    return l;
                });
                setLocations(nextLocs);
                await localforage.setItem('pikmin-seedlings', nextLocs);
                await syncToCloud(nextLocs);
            };

            const handleDeleteLocation = async (key) => {
                if (!isAdmin) return;
                if (!confirm("確定要刪除這個地點的所有紀錄嗎？")) return;
                const newLocs = locations.filter(l => l.key !== key);
                setLocations(newLocs);
                await localforage.setItem('pikmin-seedlings', newLocs);
                await syncToCloud(newLocs);
            };

            const handleDeleteVisit = async (locKey, visitId) => {
                if (!isAdmin) return;
                if (!confirm("確定要刪除該時間點的紀錄嗎？")) return;
                let newLocs = locations.map(l => {
                    if (l.key === locKey) {
                        return { ...l, visits: l.visits.filter(v => v.id !== visitId) };
                    }
                    return l;
                }).filter(l => l.visits.length > 0); 
                setLocations(newLocs);
                await localforage.setItem('pikmin-seedlings', newLocs);
                await syncToCloud(newLocs);
            };

            const toggleExpand = (key) => {
                const next = new Set(expandedLocs);
                if (next.has(key)) next.delete(key);
                else next.add(key);
                setExpandedLocs(next);
            };
            
            const handleCopyCoords = (e, lat, lng) => {
                e.stopPropagation(); 
                const coordsText = `${lat}, ${lng}`;
                navigator.clipboard.writeText(coordsText).then(() => {
                    const btn = e.currentTarget;
                    const originalHTML = btn.innerHTML;
                    btn.innerHTML = '<i class="fas fa-check text-emerald-500"></i>';
                    setTimeout(() => { btn.innerHTML = originalHTML; }, 1000);
                });
            };

            const filteredLocations = useMemo(() => {
                if (globalFilterCat === "全部" && globalFilterColor === "全部") {
                    return [...locations].sort((a,b) => b.visits[0].date.localeCompare(a.visits[0].date));
                }

                return locations.filter(loc => {
                    return loc.visits.some(v => 
                        (v.records || []).some(r => {
                            let matchCat = true;
                            let matchSub = true;
                            let matchColor = true;

                            if (globalFilterCat !== "全部") {
                                matchCat = (r.category === globalFilterCat);
                                if (globalFilterSub !== "全部") {
                                    matchSub = (r.subCategory === globalFilterSub);
                                }
                            }

                            if (globalFilterColor !== "全部") {
                                matchColor = !!(r.colors && r.colors[globalFilterColor] > 0);

                                                        return (
                                                            <div key={visit.id} className="relative pl-6 border-l-[3px] border-emerald-200 ml-2">
                                                                <div className="absolute -left-[10.5px] top-0 bg-gradient-to-br from-emerald-400 to-teal-500 w-5 h-5 rounded-full border-[3px] border-white shadow-md"></div>
                                                                <div className="flex justify-between items-center mb-3">
                                                                    <div className="flex items-center gap-2">
                                                                        <h3 className="text-xs font-bold text-emerald-800 bg-white px-3 py-1.5 rounded-lg shadow-sm border border-emerald-100 flex items-center gap-1.5">
                                                                            <i className="far fa-calendar-alt text-emerald-500"></i> {formatDateOnly(visit.date)}
                                                                        </h3>
                                                                        <span className="text-[10px] font-bold text-amber-700 bg-amber-50 px-2.5 py-1.5 rounded-lg shadow-sm border border-amber-200/60 flex items-center gap-1">
                                                                            <i className="fas fa-bullseye opacity-50"></i>
                                                                            {currentTarget}{currentSubTarget !== "全部" ? ` (${currentSubTarget})` : ""}: {visitTargetCount} 盆
                                                                        </span>
                                                                    </div>
                                                                    <div className="flex gap-2 text-xs">
                                                                        <a href={`https://www.google.com/maps/search/?api=1&query=${loc.lat},${loc.lng}`} target="_blank" rel="noreferrer" className="text-blue-600 bg-blue-50 hover:bg-blue-100 px-2.5 py-1.5 rounded-lg font-bold transition-colors flex items-center gap-1.5 shadow-sm" title="Google 地圖">
                                                                            <i className="fas fa-map-marked-alt text-[10px]"></i> Map
                                                                        </a>
                                                                        {isAdmin && (
                                                                            <button className="text-emerald-600 bg-emerald-50 hover:bg-emerald-100 px-2.5 py-1.5 rounded-lg font-bold transition-colors flex items-center gap-1.5 shadow-sm" onClick={() => handleEditVisit(loc, visit)}>
                                                                                <i className="fas fa-edit text-[10px]"></i> 編輯
                                                                            </button>
                                                                        )}
                                                                        {isAdmin && (
                                                                            <button className="text-red-500 bg-red-50 hover:bg-red-100 px-2.5 py-1.5 rounded-lg font-bold transition-colors shadow-sm" onClick={() => handleDeleteVisit(loc.key, visit.id)}>刪除</button>
                                                                        )}
                                                                    </div>
                                                                </div>
                                                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 mt-2">
                                                                    {(visit.records || []).map((rec, i) => {
                                                                        const activeColors = Object.entries(rec.colors || {}).filter(([_,v]) => v > 0);
                                                                        if (activeColors.length === 0) return null;
                                                                        return (
                                                                            <div key={i} className="bg-white border border-slate-200/80 p-3.5 rounded-2xl shadow-sm hover:border-emerald-200 transition-colors">
                                                                                <div className="flex items-center gap-2 mb-3 pb-2.5 border-b border-slate-100">
                                                                                    <span className="text-xs font-bold text-emerald-800 bg-emerald-100/70 px-2.5 py-1 rounded-md">{rec.category}</span>
                                                                                    {rec.category !== "路邊" && rec.subCategory !== "其他" && <span className="text-xs font-bold text-slate-600 bg-slate-100 px-2.5 py-1 rounded-md">{rec.subCategory}</span>}
                                                                                </div>
                                                                                <div className="flex flex-wrap gap-2">
                                                                                    {activeColors.map(([colorKey, count]) => {
                                                                                        const c = COLORS.find(col => col.id === colorKey);
                                                                                        return c ? (
                                                                                            <span key={colorKey} className={`text-[11px] font-bold px-2 py-0.5 rounded-md flex items-center gap-1.5 ${c.bg} ${c.text} ${c.border || ''} shadow-sm`}>
                                                                                                {c.id} <span className="bg-black/15 px-1.5 py-[1px] rounded min-w-[1.2rem] text-center backdrop-blur-sm">{count}</span>
                                                                                            </span>
                                                                                        ) : null;
                                                                                    })}
                                                                                </div>
                                                                            </div>
                                                                        )
                                                                    })}
                                                                </div>
                                                            </div>
                                                        )
                                                    })}
                                                </div>
                                            )}
                                        </div>
                                    );
                                })
                            )}
                        </div>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
