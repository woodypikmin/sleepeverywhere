<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pikmin bloom 純點刷盆記錄</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f1f5f9; }
        input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        const { useState, useEffect } = React;

        const PIKMIN_CATEGORIES = {
            "餐廳": ["廚師帽子"], "咖啡廳": ["咖啡杯"], "甜點店": ["馬卡龍", "甜甜圈"], "電影院": ["爆米花"],
            "藥局": ["牙刷"], "動物園": ["蒲公英"], "森林": ["鍬形蟲", "橡栗"], "水邊": ["擬餌"],
            "郵局": ["郵票"], "美術館": ["畫框"], "機場": ["飛機玩具"], "車站": ["電車紙模型", "票券"],
            "海灘": ["貝殼"], "漢堡店": ["漢堡"], "便利商店": ["瓶蓋", "零食"], "超市": ["蘑菇", "香蕉"],
            "麵包店": ["法國麵包"], "美容院": ["剪刀"], "服飾店": ["髮圈"], "公園": ["幸運草", "四葉幸運草"],
            "圖書館": ["迷你書"], "路邊": ["路邊"], "壽司餐廳": ["壽司"],
            "山丘": ["山丘別針徽章"], "體育館": ["體育館鑰匙圈"], "五金行": ["工具"], "公車站": ["公車紙模型"],
            "化妝品商店": ["化妝品"], "義式餐廳": ["披薩", "義大利麵"], "咖哩餐廳": ["一碗咖哩"],
            "飯店": ["飯店備品"], "主題樂園": ["主題樂園門票"], "墨西哥餐廳": ["塔可餅"], "橋樑": ["橋樑別針"],
            "神社和寺廟": ["大吉", "吉", "末吉"], "洗衣店": ["洗衣用品"], "拉麵店": ["拉麵鑰匙圈"],
            "學校": ["校徽胸針"], "電器行": ["電池", "仙女燈"], "韓國餐廳": ["韓國泡菜"], "起司店": ["起司"],
            "其他": ["其他"]
        };

        const COLORS = [
            { id: 'red', label: '紅', bg: 'bg-red-500', text: 'text-white' },
            { id: 'yellow', label: '黃', bg: 'bg-yellow-400', text: 'text-yellow-900' },
            { id: 'blue', label: '藍', bg: 'bg-blue-500', text: 'text-white' },
            { id: 'purple', label: '紫', bg: 'bg-purple-600', text: 'text-white' },
            { id: 'white', label: '白', bg: 'bg-white', text: 'text-gray-800', border: 'border border-gray-300' },
            { id: 'pink', label: '粉', bg: 'bg-pink-400', text: 'text-white' },
            { id: 'rock', label: '岩', bg: 'bg-gray-600', text: 'text-white' },
            { id: 'ice', label: '冰', bg: 'bg-cyan-300', text: 'text-cyan-900' }
        ];

        const getEmptyColors = () => ({ red: 0, yellow: 0, blue: 0, purple: 0, white: 0, pink: 0, rock: 0, ice: 0 });

        const App = () => {
            const [locations, setLocations] = useState([]);
            const [lat, setLat] = useState("");
            const [lng, setLng] = useState("");
            const [region, setRegion] = useState("");
            const [visitDate, setVisitDate] = useState(new Date().toISOString().split('T')[0]);
            const [records, setRecords] = useState([{ id: Date.now(), category: "餐廳", subCategory: "廚師帽子", colors: getEmptyColors() }]);
            const [editingVisitId, setEditingVisitId] = useState(null);

            useEffect(() => {
                localforage.config({ name: 'PikminHarvestTracker' });
                localforage.getItem('pikmin-seedlings').then(saved => saved && setLocations(saved));
            }, []);

            const detectLocation = async () => {
                if (!lat || !lng) return alert("請先輸入座標");
                try {
                    const res = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lng}&localityLanguage=zh-tw`);
                    const data = await res.json();
                    let parts = [data.principalSubdivision, data.locality || data.city].filter(Boolean);
                    setRegion(parts.join(" ") || "未知區域");
                } catch (e) { alert("無法辨識地點"); }
            };

            const handleSave = async () => {
                const locKey = `${parseFloat(lat).toFixed(5)},${parseFloat(lng).toFixed(5)}`;
                let newLocs = [...locations];
                let locIdx = newLocs.findIndex(l => l.key === locKey);
                
                const newVisit = { id: editingVisitId || Date.now().toString(), date: visitDate, records };

                if (locIdx >= 0) {
                    if (editingVisitId) {
                        newLocs[locIdx].visits = newLocs[locIdx].visits.map(v => v.id === editingVisitId ? newVisit : v);
                    } else {
                        newLocs[locIdx].visits.push(newVisit);
                    }
                } else {
                    newLocs.push({ key: locKey, lat, lng, region, visits: [newVisit] });
                }
                
                await localforage.setItem('pikmin-seedlings', newLocs);
                setLocations(newLocs);
                setEditingVisitId(null);
                alert("儲存成功！");
            };

            return (
                <div className="max-w-4xl mx-auto p-4">
                    <h1 className="text-2xl font-black mb-6 text-emerald-800">📋 盆栽紀錄表</h1>
                    
                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 mb-6">
                        <div className="grid grid-cols-2 gap-4 mb-4">
                            <input value={lat} onChange={e=>setLat(e.target.value)} placeholder="緯度" className="p-2 border rounded-lg"/>
                            <input value={lng} onChange={e=>setLng(e.target.value)} placeholder="經度" className="p-2 border rounded-lg"/>
                        </div>
                        <div className="flex gap-2 mb-4">
                            <button onClick={detectLocation} className="bg-emerald-600 text-white px-4 py-2 rounded-lg text-sm font-bold">解析地點與時間</button>
                            <input type="date" value={visitDate} onChange={e => setVisitDate(e.target.value)} className="p-2 border rounded-lg"/>
                        </div>
                        <p className="text-sm font-bold text-emerald-700 mb-4">地點: {region}</p>

                        {records.map((rec, i) => (
                            <div key={rec.id} className="bg-slate-50 p-3 rounded-xl mb-3">
                                <div className="flex gap-2 mb-2">
                                    <select value={rec.category} onChange={e => setRecords(records.map((r,idx) => idx===i ? {...r, category: e.target.value, subCategory: PIKMIN_CATEGORIES[e.target.value][0]} : r))} className="p-2 border rounded w-1/2">
                                        {Object.keys(PIKMIN_CATEGORIES).map(c => <option key={c} value={c}>{c}</option>)}
                                    </select>
                                    {rec.category !== "路邊" && (
                                        <select value={rec.subCategory} onChange={e => setRecords(records.map((r,idx) => idx===i ? {...r, subCategory: e.target.value} : r))} className="p-2 border rounded w-1/2">
                                            {PIKMIN_CATEGORIES[rec.category].map(sc => <option key={sc} value={sc}>{sc}</option>)}
                                        </select>
                                    )}
                                </div>
                                <div className="grid grid-cols-4 gap-1">
                                    {COLORS.map(color => (
                                        <div key={color.id} className="flex flex-col items-center">
                                            <span className="text-[10px]">{color.label}</span>
                                            <input type="number" className="w-12 text-center border rounded" value={rec.colors[color.id]} onChange={e => setRecords(records.map((r,idx) => idx===i ? {...r, colors: {...r.colors, [color.id]: parseInt(e.target.value)||0}} : r))}/>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        ))}
                        <button onClick={() => setRecords([...records, { id: Date.now(), category: "餐廳", subCategory: "廚師帽子", colors: getEmptyColors() }])} className="w-full py-2 bg-slate-200 rounded-lg font-bold text-sm">+ 新增分類</button>
                        <button onClick={handleSave} className="w-full mt-4 py-3 bg-emerald-600 text-white font-black rounded-xl">儲存收成</button>
                    </div>

                    <div className="space-y-4">
                        {locations.map(loc => (
                            <div key={loc.key} className="bg-white p-4 rounded-xl border border-slate-200">
                                <h2 className="font-bold text-lg">{loc.region} <LocalTimeDisplay lat={loc.lat} lng={loc.lng} /></h2>
                                {loc.visits.map(v => (
                                    <div key={v.id} className="mt-3 border-t pt-2">
                                        <div className="flex justify-between text-xs text-slate-500 font-bold mb-2"><span>{v.date}</span> <button onClick={() => {setEditingVisitId(v.id); setRecords(v.records);}} className="text-emerald-600">編輯</button></div>
                                        {v.records.map((r, i) => <div key={i} className="text-sm"><b>{r.category}</b>: {Object.entries(r.colors).filter(([_,c])=>c>0).map(([k,c]) => `${k}:${c}`).join(', ')}</div>)}
                                    </div>
                                ))}
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
